<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d16"/>
      <stop offset="100%" stop-color="#151830"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00fff2"/>
      <stop offset="50%" stop-color="#b967ff"/>
      <stop offset="100%" stop-color="#ff2e88"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="110" cy="150" r="70"/>
    </clipPath>
  </defs>

  <!-- outer card -->
  <rect x="2" y="2" width="896" height="296" rx="20" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- photo ring + photo -->
  <circle cx="110" cy="150" r="76" fill="none" stroke="url(#borderGrad)" stroke-width="3" filter="url(#glow)"/>
  <image href="https://raw.githubusercontent.com/Abdullah-qazi-1/Abdullah-qazi-1/main/assets/profile.png"
         x="34" y="74" width="152" height="152" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- name -->
  <text x="220" y="105" font-family="Consolas, 'Courier New', monospace" font-size="32" font-weight="700" fill="#ffffff">Abdullah</text>

  <!-- cycling role line -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#00fff2">
    <text x="220" y="132" opacity="0">
      AI / ML Engineer
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.33;0.38" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="220" y="132" opacity="0">
      RAG &amp; LLM Systems Builder
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.33;0.38" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="220" y="132" opacity="0">
      MLOps · Cloud Deployment
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.33;0.38" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- contact rows -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#9aa4bf">
    <circle cx="224" cy="158" r="3" fill="#b967ff"/>
    <text x="236" y="163">Islamabad, Pakistan</text>
    <circle cx="224" cy="180" r="3" fill="#b967ff"/>
    <text x="236" y="185">abdullahizaq321@gmail.com</text>
    <circle cx="224" cy="202" r="3" fill="#b967ff"/>
    <text x="236" y="207">linkedin.com/in/abdullah1datascientist</text>
  </g>

  <!-- achievement badges -->
  <g font-family="Consolas, monospace" font-size="12" fill="#e6e6e6">
    <circle cx="235" cy="235" r="14" fill="#1c1f33" stroke="#ffcc00" stroke-width="1.5"/>
    <text x="235" y="240" text-anchor="middle" font-size="14">🏆</text>
    <circle cx="270" cy="235" r="14" fill="#1c1f33" stroke="#00fff2" stroke-width="1.5"/>
    <text x="270" y="240" text-anchor="middle" font-size="14">⭐</text>
    <circle cx="305" cy="235" r="14" fill="#1c1f33" stroke="#ff2e88" stroke-width="1.5"/>
    <text x="305" y="240" text-anchor="middle" font-size="14">🔥</text>
  </g>

  <!-- terminal box -->
  <rect x="480" y="40" width="380" height="220" rx="10" fill="#0a0c16" stroke="#2a2f4a" stroke-width="1.5"/>
  <rect x="480" y="40" width="380" height="28" rx="10" fill="#141830"/>
  <circle cx="498" cy="54" r="5" fill="#ff5f56"/>
  <circle cx="516" cy="54" r="5" fill="#ffbd2e"/>
  <circle cx="534" cy="54" r="5" fill="#27c93f"/>
  <text x="660" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#6b7290">abdullah@portfolio: ~</text>

  <g font-family="Consolas, monospace" font-size="13">
    <text x="498" y="95" fill="#27c93f">$ whoami</text>
    <text x="498" y="115" fill="#e6e6e6">Abdullah — AI/ML &amp; GenAI Engineer</text>

    <text x="498" y="145" fill="#27c93f">$ stack --core</text>
    <text x="498" y="165" fill="#e6e6e6">Python · LangChain · FastAPI</text>
    <text x="498" y="183" fill="#e6e6e6">Docker · AWS · MLflow</text>

    <text x="498" y="213" fill="#27c93f">$ status</text>
    <text x="498" y="233" fill="#e6e6e6">Shipping RAG pipelines to prod
      <tspan fill="#00fff2">_</tspan>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
