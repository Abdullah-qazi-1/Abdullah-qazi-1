<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="icon1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00fff2"/><stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="icon2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b967ff"/><stop offset="100%" stop-color="#6a2bd9"/>
    </linearGradient>
    <linearGradient id="icon3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2e88"/><stop offset="100%" stop-color="#c81b63"/>
    </linearGradient>
    <linearGradient id="icon4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcc00"/><stop offset="100%" stop-color="#e08e00"/>
    </linearGradient>
  </defs>

  <!-- Card 1 -->
  <g>
    <rect x="0" y="0" width="440" height="200" rx="14" fill="#0f1120" stroke="#252a45" stroke-width="1.5"/>
    <rect x="24" y="24" width="52" height="52" rx="12" fill="url(#icon1)"/>
    <text x="50" y="57" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0b0d16">RAG</text>
    <text x="92" y="42" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#ffffff">RAG Repository Assistant</text>
    <text x="92" y="62" font-family="Segoe UI, Arial" font-size="11" fill="#7d8399">Q&amp;A over any GitHub repo</text>
    <foreignObject x="24" y="90" width="392" height="70">
    </foreignObject>
    <text font-family="Segoe UI, Arial" font-size="12" fill="#b3b9cc">
      <tspan x="24" y="102">Ingestion pipeline that clones a repo, chunks code</tspan>
      <tspan x="24" y="120">and docs into embeddings, and answers questions</tspan>
      <tspan x="24" y="138">on architecture, logic, and setup.</tspan>
    </text>
    <g font-family="Consolas, monospace" font-size="10" fill="#9aa4bf">
      <rect x="24" y="160" width="72" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="60" y="173" text-anchor="middle">LangChain</text>
      <rect x="104" y="160" width="52" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="130" y="173" text-anchor="middle">FAISS</text>
      <rect x="164" y="160" width="66" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="197" y="173" text-anchor="middle">FastAPI</text>
      <rect x="238" y="160" width="60" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="268" y="173" text-anchor="middle">Docker</text>
    </g>
  </g>

  <!-- Card 2 -->
  <g transform="translate(460,0)">
    <rect x="0" y="0" width="440" height="200" rx="14" fill="#0f1120" stroke="#252a45" stroke-width="1.5"/>
    <rect x="24" y="24" width="52" height="52" rx="12" fill="url(#icon2)"/>
    <text x="50" y="57" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0b0d16">DOC</text>
    <text x="92" y="42" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#ffffff">Document Q&amp;A Assistant</text>
    <text x="92" y="62" font-family="Segoe UI, Arial" font-size="11" fill="#7d8399">RAG over 50+ private PDFs</text>
    <text font-family="Segoe UI, Arial" font-size="12" fill="#b3b9cc">
      <tspan x="24" y="102">Chunking/embedding pipeline with FAISS retrieval,</tspan>
      <tspan x="24" y="120">a re-ranking step that cut hallucinations, and an</tspan>
      <tspan x="24" y="138">evaluation harness tracking precision/recall.</tspan>
    </text>
    <g font-family="Consolas, monospace" font-size="10" fill="#9aa4bf">
      <rect x="24" y="160" width="72" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="60" y="173" text-anchor="middle">LangChain</text>
      <rect x="104" y="160" width="52" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="130" y="173" text-anchor="middle">FAISS</text>
      <rect x="164" y="160" width="66" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="197" y="173" text-anchor="middle">FastAPI</text>
      <rect x="238" y="160" width="52" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="264" y="173" text-anchor="middle">LLM</text>
    </g>
  </g>

  <!-- Card 3 -->
  <g transform="translate(0,220)">
    <rect x="0" y="0" width="440" height="200" rx="14" fill="#0f1120" stroke="#252a45" stroke-width="1.5"/>
    <rect x="24" y="24" width="52" height="52" rx="12" fill="url(#icon3)"/>
    <text x="50" y="57" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0b0d16">SEC</text>
    <text x="92" y="42" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#ffffff">Phishing Website Detection</text>
    <text x="92" y="62" font-family="Segoe UI, Arial" font-size="11" fill="#7d8399">94%+ F1-score · MLOps pipeline</text>
    <text font-family="Segoe UI, Arial" font-size="12" fill="#b3b9cc">
      <tspan x="24" y="102">Automated preprocessing across 50,000+ URL records,</tspan>
      <tspan x="24" y="120">deployed to AWS EC2 via Docker with GitHub Actions</tspan>
      <tspan x="24" y="138">CI/CD, tracked via MLflow and DagsHub.</tspan>
    </text>
    <g font-family="Consolas, monospace" font-size="10" fill="#9aa4bf">
      <rect x="24" y="160" width="86" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="67" y="173" text-anchor="middle">Scikit-learn</text>
      <rect x="118" y="160" width="72" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="154" y="173" text-anchor="middle">MongoDB</text>
      <rect x="198" y="160" width="60" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="228" y="173" text-anchor="middle">Docker</text>
      <rect x="266" y="160" width="46" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="289" y="173" text-anchor="middle">AWS</text>
    </g>
  </g>

  <!-- Card 4 -->
  <g transform="translate(460,220)">
    <rect x="0" y="0" width="440" height="200" rx="14" fill="#0f1120" stroke="#252a45" stroke-width="1.5"/>
    <rect x="24" y="24" width="52" height="52" rx="12" fill="url(#icon4)"/>
    <text x="50" y="57" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0b0d16">ECO</text>
    <text x="92" y="42" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#ffffff">Food Price Intelligence</text>
    <text x="92" y="62" font-family="Segoe UI, Arial" font-size="11" fill="#7d8399">0.97 R2 · 4 live data APIs</text>
    <text font-family="Segoe UI, Arial" font-size="12" fill="#b3b9cc">
      <tspan x="24" y="102">Forecasts prices of 5 food commodities using FX rate,</tspan>
      <tspan x="24" y="120">oil, inflation and weather feeds. Identified and fixed</tspan>
      <tspan x="24" y="138">a data-leakage bug that had inflated R2 to 0.99.</tspan>
    </text>
    <g font-family="Consolas, monospace" font-size="10" fill="#9aa4bf">
      <rect x="24" y="160" width="62" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="55" y="173" text-anchor="middle">XGBoost</text>
      <rect x="94" y="160" width="66" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="127" y="173" text-anchor="middle">LightGBM</text>
      <rect x="168" y="160" width="66" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="201" y="173" text-anchor="middle">FastAPI</text>
      <rect x="242" y="160" width="86" height="20" rx="10" fill="#181c30" stroke="#2f3555"/>
      <text x="285" y="173" text-anchor="middle">GH Actions</text>
    </g>
  </g>
</svg>
